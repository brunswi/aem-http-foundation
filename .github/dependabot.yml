# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
    ignore:
      # Johnzon 2.x is jakarta-only; aem-sdk-api ships javax.json on the test classpath
      # and would VerifyError at startup. Stay on 1.x until AEM SDK migrates to jakarta.json.
      - dependency-name: "org.apache.johnzon:johnzon-core"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
